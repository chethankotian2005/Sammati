<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%" style="background-color: #F6F7FB; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  
  <defs>
    <style>
      .box { fill: #FFFFFF; stroke: #E3E5F0; stroke-width: 2px; rx: 16px; ry: 16px; }
      .header { font-weight: 800; font-size: 24px; fill: #16173F; }
      .text { font-size: 16px; fill: #6B6F8C; }
      .line { stroke: #6B6F8C; stroke-width: 2px; stroke-dasharray: 6 6; fill: none; }
      .arrow { fill: #6B6F8C; }
      .badge { fill: #F4A300; rx: 12px; }
      .badge-text { fill: #16173F; font-size: 14px; font-weight: 700; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" class="arrow" />
    </marker>
  </defs>

  <!-- 1. Citizen Wallet -->
  <g transform="translate(100, 100)">
    <rect width="220" height="150" class="box" />
    <text x="30" y="45" class="header">Citizen Wallet</text>
    <text x="30" y="80" class="text">📱 Manages consent</text>
    <text x="30" y="105" class="text">✍️ Cryptographic signing</text>
    <text x="30" y="130" class="text">🔔 Real-time alerts</text>
  </g>

  <!-- 2. Company / Gateway -->
  <g transform="translate(680, 100)">
    <rect width="220" height="150" class="box" />
    <text x="30" y="45" class="header">Company API</text>
    <text x="30" y="80" class="text">🚧 Gateway middleware</text>
    <text x="30" y="105" class="text">🛡 Blocks without consent</text>
    <text x="30" y="130" class="text">📦 Anchors access logs</text>
  </g>

  <!-- 3. Blockchain Ledger -->
  <g transform="translate(390, 250)">
    <rect width="220" height="150" class="box" />
    <text x="60" y="45" class="header">The Ledger</text>
    <text x="30" y="80" class="text">⛓ Immutable registry</text>
    <text x="30" y="105" class="text">✅ Enforces logic</text>
    <text x="30" y="130" class="text">👤 Zero personal data</text>
    
    <rect x="75" y="-15" width="70" height="24" class="badge" />
    <text x="85" y="2" class="badge-text">Core</text>
  </g>

  <!-- 4. Regulator Auditor -->
  <g transform="translate(390, 430)">
    <rect width="220" height="120" class="box" />
    <text x="50" y="40" class="header">Regulator</text>
    <text x="25" y="75" class="text">🕵️ Rebuilds hash chains</text>
    <text x="25" y="100" class="text">🚨 Detects log tampering</text>
  </g>

  <!-- 5. Sammati Processor (confidential processing) -->
  <g transform="translate(730, 430)">
    <rect width="220" height="120" class="box" />
    <text x="30" y="40" class="header">Processor</text>
    <text x="30" y="70" class="text">🔐 Opens data in memory</text>
    <text x="30" y="95" class="text">Returns a decision only</text>
    <rect x="70" y="-15" width="80" height="24" class="badge" />
    <text x="78" y="2" class="badge-text">Simulated</text>
  </g>

  <!-- Connections -->
  <!-- Wallet to Processor: ciphertext only -->
  <path d="M 150 250 L 150 580 L 840 580 L 840 555" class="line" marker-end="url(#arrowhead)" />
  <text x="160" y="570" class="text" style="font-size: 14px; font-style: italic;">Ciphertext only</text>

  <!-- Company to Processor: handle in, decision out -->
  <path d="M 840 430 L 840 255" class="line" marker-end="url(#arrowhead)" />
  <text x="700" y="420" class="text" style="font-size: 14px; font-style: italic;">Handle in, decision out</text>

  <!-- Wallet to Ledger -->
  <path d="M 210 250 L 210 325 L 380 325" class="line" marker-end="url(#arrowhead)" />
  <text x="220" y="315" class="text" style="font-size: 14px; font-style: italic;">Signs Grants/Withdrawals</text>

  <!-- Gateway to Ledger -->
  <path d="M 790 250 L 790 325 L 620 325" class="line" marker-end="url(#arrowhead)" />
  <text x="630" y="315" class="text" style="font-size: 14px; font-style: italic;">Anchors Merkle Roots</text>

  <!-- Ledger to Regulator -->
  <path d="M 500 400 L 500 420" class="line" marker-end="url(#arrowhead)" />
  <text x="510" y="415" class="text" style="font-size: 14px; font-style: italic;">Public Proofs</text>

  <!-- Wallet to Gateway (Scan QR) -->
  <path d="M 320 150 L 670 150" class="line" marker-end="url(#arrowhead)" />
  <text x="430" y="140" class="text" style="font-size: 14px; font-style: italic;">Scans QR / Notifies</text>

</svg>
